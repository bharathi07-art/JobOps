name: JobOps CI/CD Production Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # JOB 1: Test and verify the backend ecosystem
  backend-ci:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Clients
        run: |
          cd backend
          npx prisma generate

      - name: Push Prisma Schema to Test DB
        run: |
          cd backend
          npx prisma db push
        env:
          DATABASE_URL: "mysql://root:root@localhost:3306/test_db"

      - name: Run Jest & Integration Testing
        run: |
          cd backend
          npm test
        env:
          NODE_ENV: test
          DATABASE_URL: "mysql://root:root@localhost:3306/test_db"
          JWT_SECRET: "supersecret"

  # JOB 2: Build and verify the frontend
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: "http://localhost:5000/api"

  # JOB 3: Run Playwright E2E Tests in a unified integration environment
  e2e-ci:
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package.json
            backend/package.json
            frontend/package.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Clients
        run: |
          cd backend
          npx prisma generate

      - name: Push Prisma Schema to Test DB
        run: |
          cd backend
          npx prisma db push
        env:
          DATABASE_URL: "mysql://root:root@localhost:3306/test_db"

      - name: Seed Test User for E2E
        run: |
          cd backend
          npx ts-node scripts/seedTestUser.ts
        env:
          DATABASE_URL: "mysql://root:root@localhost:3306/test_db"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: "http://localhost:5000/api"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E Tests
        run: npx playwright test
        env:
          CI: true
          PORT: 5000
          DB_URI: "mongodb://localhost:27017/test_db"
          DATABASE_URL: "mysql://root:root@localhost:3306/test_db"
          JWT_SECRET: "supersecret"
          NODE_ENV: test
          VITE_API_URL: "http://localhost:5000/api"

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # JOB 4: Deploy Application (CD)
  deploy:
    needs: [backend-ci, frontend-ci, e2e-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy Application
        run: echo "Deploying application to production server..."
