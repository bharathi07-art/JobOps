name: JobOps CI/CD Production Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # JOB 1: Test and verify the backend ecosystem
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Clients
        run: |
          cd backend
          npx prisma Generate

      - name: Run Jest & Integration Testing
        run: |
          cd backend
          npm test
        env:
          NODE_ENV: test
          DATABASE_URL: "mysql://mock_user:mock_pass@localhost:3306/mock_db"

#JOB 2: Test and verify the frontend with Playwright
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build

      - name:
          Run Playwright E2E Tests
          # We spin up the frontend preview server so Playwright has a target to hit
        run: |
          cd frontend
          npm run preview & 
          npx playwright test

# Deployee
  deploy:
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy Backend
        run: echo "Deploye application to production server....."
